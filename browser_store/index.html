<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font:13px/1.5 system-ui,sans-serif;color:#b9b4c4;background:transparent}
#status{padding:7px 10px;border:1px solid #617a6b;border-radius:8px;overflow-wrap:anywhere}
.error{color:#ffccbc;border-color:#e89585!important}button{margin-left:8px;cursor:pointer}
</style>
<div id="status" role="status" aria-live="polite">このブラウザの保存データを確認中…</div>
<script>
"use strict";
const STORAGE_KEY = "splatoon-team-balancer:v2";
const statusBox = document.getElementById("status");
let token = null, expectedRaw = null, loaded = false, conflict = false, unavailable = false;
function send(type, fields={}) {
  window.parent.postMessage({isStreamlitMessage:true,type,...fields}, "*");
}
function report(message, error=false) {
  statusBox.textContent = message;
  statusBox.className = error ? "error" : "";
  send("streamlit:setFrameHeight", {height:error ? 76 : 42});
}
function conflictNotice() {
  conflict = true;
  report("別のタブで記録が更新されました。自動保存を停止しています。必要なら今の内容をバックアップし、このページを再読み込みしてください。", true);
}
window.addEventListener("storage", event => {
  if ((event.key === STORAGE_KEY || event.key === null) && loaded && event.newValue !== expectedRaw) conflictNotice();
});
window.addEventListener("message", event => {
  if (event.source !== window.parent || event.data?.type !== "streamlit:render") return;
  const args = event.data.args;
  if (token !== args.token) {
    token = args.token;
    loaded = false; conflict = false; unavailable = false;
    try {
      expectedRaw = window.localStorage.getItem(STORAGE_KEY);
      loaded = true;
      report(expectedRaw ? "保存データを復元中…" : "このブラウザに自動保存します。");
      send("streamlit:setComponentValue", {dataType:"json",value:{token,raw:expectedRaw,error:null}});
    } catch (error) {
      unavailable = true;
      report("ブラウザの保存領域が利用できません。保存の許可設定を確認してください。", true);
      send("streamlit:setComponentValue", {dataType:"json",value:{token,raw:null,error:"storage_unavailable"}});
    }
    return; // Never write until Python has validated the restored data.
  }
  if (!loaded || unavailable || !args.payload || conflict) return;
  try {
    const current = window.localStorage.getItem(STORAGE_KEY);
    if (current !== expectedRaw) { conflictNotice(); return; }
    if (args.payload !== expectedRaw) {
      window.localStorage.setItem(STORAGE_KEY, args.payload);
      expectedRaw = args.payload;
    }
    const stamp = JSON.parse(expectedRaw).updated_at;
    report("✓ このブラウザに保存済み · " + stamp.replace("T", " ").replace("+09:00", ""));
  } catch (error) {
    report("自動保存に失敗しました。ブラウザの容量・設定を確認し、バックアップをダウンロードしてください。", true);
  }
});
send("streamlit:componentReady", {apiVersion:1});
send("streamlit:setFrameHeight", {height:42});
</script>
</html>
